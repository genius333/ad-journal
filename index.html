<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал АД</title>
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="manifest-journal.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            user-select: none; /* Чтобы текст не выделялся при тапах */
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #007bff;
            margin: 0;
            font-size: 22px;
        }

        .date-header {
            font-weight: bold;
            color: #007bff;
            margin: 20px 0 10px;
            font-size: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .record {
            background: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer; /* Показываем, что можно нажать */            transition: transform 0.1s;
        }
        .record:active { transform: scale(0.98); }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .time {
            font-size: 13px;
            color: #666;
        }

        .bp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .pulse {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #e53935;
        }

        .pulse-icon { font-size: 20px; }

        /* Скрытый статус */
        .status-label {
            display: none;
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
            animation: fadeIn 0.2s ease;
        }
        .status-label.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        /* Полоски */
        .status-bar {
            width: 6px;
            height: 40px;
            border-radius: 3px;            margin-left: 10px;
        }
        .status-normal { background: #4caf50; }      /* Зелёный */
        .status-moderate { background: #8bc34a; }    /* Салатовый */
        .status-elevated { background: #ffc107; }    /* Жёлтый */
        .status-high { background: #f44336; }        /* Красный */

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 300;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Журнал измерений</h1>
</div>

<div id="records-container"></div>

<a href="https://genius333.github.io/ad-calculator/" class="fab">+</a>

<script>
let allRecords = [];

function toLocalDateTimeStr(date) {
    const d = new Date(date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${day} ${h}:${min}`;
}

function getStatusInfo(s, d) {
    if (s >= 160 || d >= 100) return { class: 'status-high', text: '⚠️ Гипертензия', color: '#f44336' };
    if (s >= 140 || d >= 90) return { class: 'status-elevated', text: '📈 Повышенное', color: '#ffc107' };
    if (s >= 120 || d >= 80) return { class: 'status-moderate', text: '⚡ Умеренно повышенное', color: '#8bc34a' };
    return { class: 'status-normal', text: '✅ Норма', color: '#4caf50' };
}

function formatDate(dateStr) {
    const [datePart] = dateStr.split(' ');
    const [y, m, d] = datePart.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return 'Сегодня';
    if (date.toDateString() === yesterday.toDateString()) return 'Вчера';
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) + ' г.';
}

function getTimeFromStr(dateStr) {
    return dateStr.split(' ')[1] || '';
}

function getDateKey(dateStr) {
    return dateStr.split(' ')[0];
}

function loadRecords() {
    const data = localStorage.getItem('ad_history');
    allRecords = data ? JSON.parse(data) : [];
    renderRecords();
}

function renderRecords() {
    const container = document.getElementById('records-container');
    
    if (allRecords.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;">📋</div>
                <div style="font-size: 18px; margin-bottom: 10px;">Нет записей</div>
                <div style="font-size: 14px;">Нажмите + чтобы добавить измерение</div>
            </div>
        `;        return;
    }

    const grouped = {};
    allRecords.forEach(record => {
        const key = getDateKey(record.date);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(record);
    });

    let html = '';
    Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(dateKey => {
        const first = grouped[dateKey][0];
        html += `<div class="date-header">${formatDate(first.date)}</div>`;
        
        grouped[dateKey].forEach(record => {
            const status = getStatusInfo(record.systolic, record.diastolic);
            const time = getTimeFromStr(record.date);
            
            html += `
                <div class="record" onclick="toggleStatus(this)">
                    <div class="record-left">
                        <div class="time">${time}</div>
                        <div class="bp-row">
                            <span>${record.systolic}/${record.diastolic}</span>
                            <span class="pulse"><span class="pulse-icon">❤️</span><span>${record.pulse}</span></span>
                        </div>
                        <div class="status-label" style="color:${status.color}">${status.text}</div>
                    </div>
                    <div class="status-bar ${status.class}"></div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}

function toggleStatus(card) {
    const label = card.querySelector('.status-label');
    label.classList.toggle('show');
}

loadRecords();
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadRecords();
});
</script>

</body>
</html>
