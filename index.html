<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал АД</title>
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="manifest-journal.json">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#333;margin:0;padding:15px;padding-bottom:90px;user-select:none}
        .header{text-align:center;margin-bottom:20px}
        .header h1{color:#007bff;margin:0;font-size:22px}
        .date-header{font-weight:bold;color:#007bff;margin:20px 0 10px;font-size:16px;border-bottom:2px solid #eee;padding-bottom:5px}
        .record{background:#fff;border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .1s}
        .record:active{transform:scale(.98)}
        .record-left{display:flex;flex-direction:column;gap:2px;flex:1}
        .time{font-size:13px;color:#666}
        .bp-row{display:flex;align-items:center;gap:15px;font-size:18px;font-weight:600;color:#333}
        .pulse{display:flex;align-items:center;gap:5px;color:#e53935}
        .pulse-icon{font-size:20px}
        .status-label{display:none;font-size:13px;font-weight:500;margin-top:4px;animation:fadeIn .2s ease}
        .status-label.show{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        .status-bar{width:6px;height:40px;border-radius:3px;margin-left:10px}
        .status-normal{background:#4caf50}.status-moderate{background:#8bc34a}.status-elevated{background:#ffc107}.status-high{background:#f44336}
        .empty-state{text-align:center;padding:60px 20px;color:#999}
        .fab{position:fixed;bottom:25px;right:25px;width:60px;height:60px;background:#007bff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:300;box-shadow:0 4px 15px rgba(0,123,255,.4);text-decoration:none}
        .loading{text-align:center;padding:40px;color:#666}
    </style>
</head>
<body>
<div class="header"><h1>📊 Журнал измерений</h1></div>
<div id="records-container"><div class="loading">⏳ Загрузка из облака...</div></div>
<a href="https://genius333.github.io/ad-calculator/" class="fab">+</a>

<script>
    const GIST_ID = '969fd26ad9b155097eed81b0449a306f';
    
    // 🔑 ТОТ ЖЕ ТОКЕН, ЧТО И В КАЛЬКУЛЯТОРЕ
    const PART_1 = 'ghp_Srh7Hhxv8bAQp4';
    const PART_2 = 'wdtmEMIQ4Bk4Ih7u3pW68e';
    const TOKEN = PART_1 + PART_2;
    
    let allRecords = [];

    function getStatusInfo(s, d) {
        if (s >= 160 || d >= 100) return { class: 'status-high', text: '⚠️ Гипертензия', color: '#f44336' };
        if (s >= 140 || d >= 90) return { class: 'status-elevated', text: '📈 Повышенное', color: '#ffc107' };
        if (s >= 120 || d >= 80) return { class: 'status-moderate', text: '⚡ Умеренно повышенное', color: '#8bc34a' };        return { class: 'status-normal', text: '✅ Норма', color: '#4caf50' };
    }

    function formatDate(dateStr) {
        const parts = dateStr.split(' ');
        const d = new Date(parts[0]);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return 'Сегодня';
        if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getDateKey(dateStr) {
        return dateStr.split(' ')[0];
    }

    async function loadFromCloud() {
        try {
            const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            const data = await res.json();
            if (data.files && data.files['bp_logs.json']) {
                allRecords = JSON.parse(data.files['bp_logs.json'].content);
                renderRecords();
            } else {
                document.getElementById('records-container').innerHTML = `<div class="empty-state">Нет данных в облаке</div>`;
            }
        } catch (e) {
            document.getElementById('records-container').innerHTML = `<div class="empty-state">❌ Ошибка загрузки</div>`;
        }
    }

    function renderRecords() {
        const container = document.getElementById('records-container');
        if (!allRecords.length) {
            container.innerHTML = `<div class="empty-state"><div style="font-size:60px;opacity:.3;margin-bottom:20px">📋</div><div>Нет записей</div><div style="font-size:14px">Нажмите + чтобы добавить</div></div>`;
            return;
        }

        const grouped = {};
        allRecords.forEach(r => {
            const key = getDateKey(r.date);
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(r);
        });

        let html = '';        Object.keys(grouped).sort((a,b) => b.localeCompare(a)).forEach(dateKey => {
            const first = grouped[dateKey][0];
            html += `<div class="date-header">${formatDate(first.date)}</div>`;
            grouped[dateKey].forEach(r => {
                const status = getStatusInfo(r.systolic, r.diastolic);
                const time = r.date.split(' ')[1];
                html += `
                    <div class="record" onclick="this.querySelector('.status-label').classList.toggle('show')">
                        <div class="record-left">
                            <div class="time">${time}</div>
                            <div class="bp-row"><span>${r.systolic}/${r.diastolic}</span><span class="pulse"><span class="pulse-icon">❤️</span><span>${r.pulse}</span></span></div>
                            <div class="status-label" style="color:${status.color}">${status.text}</div>
                        </div>
                        <div class="status-bar ${status.class}"></div>
                    </div>`;
            });
        });
        container.innerHTML = html;
    }

    loadFromCloud();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFromCloud(); });
</script>
</body>
</html>
