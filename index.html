<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал АД</title>
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="manifest-journal.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #007bff;
            margin: 0;
            font-size: 22px;
        }

        .date-header {
            font-weight: bold;
            color: #007bff;
            margin: 20px 0 10px;
            font-size: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .record {
            background: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .time {
            font-size: 13px;
            color: #666;
        }

        .bp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .pulse {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #e53935;
        }

        .pulse-icon {
            font-size: 20px;
        }

        .status-bar {
            width: 6px;
            height: 40px;
            border-radius: 3px;
            margin-left: 10px;
        }

        .status-normal { background: #4caf50; }
        .status-elevated { background: #ffc107; }
        .status-high1 { background: #ff9800; }
        .status-high2 { background: #f44336; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .fab {            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 300;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Журнал измерений</h1>
</div>

<div id="records-container"></div>

<a href="https://genius333.github.io/ad-calculator/" class="fab">+</a>

<script>
let allRecords = [];

function loadRecords() {
    const data = localStorage.getItem('ad_history');
    allRecords = data ? JSON.parse(data) : [];
    renderRecords();
}

function getStatusClass(systolic, diastolic) {
    if (systolic >= 140 || diastolic >= 90) return 'status-high2';
    if (systolic >= 130 || diastolic >= 80) return 'status-high1';
    if (systolic >= 120 && diastolic < 80) return 'status-elevated';
    return 'status-normal';
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    
    // Проверка на ISO формат (новый)
    if (dateStr.includes('T')) {
        const today = new Date();        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        if (date.toDateString() === today.toDateString()) {
            return 'Сегодня';
        } else if (date.toDateString() === yesterday.toDateString()) {
            return 'Вчера';
        } else {
            return date.toLocaleDateString('ru-RU', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            }) + ' г.';
        }
    } else {
        // Для старых записей (русский формат)
        return dateStr;
    }
}

function getTimeFromISO(dateStr) {
    if (dateStr.includes('T')) {
        const date = new Date(dateStr);
        return date.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    } else {
        const parts = dateStr.split(',');
        return parts[1]?.trim() || '';
    }
}

function renderRecords() {
    const container = document.getElementById('records-container');
    
    if (allRecords.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;">📋</div>
                <div style="font-size: 18px; margin-bottom: 10px;">Нет записей</div>
                <div style="font-size: 14px;">Нажмите + чтобы добавить измерение</div>
            </div>
        `;
        return;
    }

    const grouped = {};
    allRecords.forEach(record => {
        const dateKey = record.date.split('T')[0]; // Для ISO формата
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push(record);
    });
    let html = '';
    Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(dateKey => {
        const firstRecord = grouped[dateKey][0];
        html += `<div class="date-header">${formatDate(firstRecord.date)}</div>`;
        
        grouped[dateKey].forEach(record => {
            const statusClass = getStatusClass(record.systolic, record.diastolic);
            const time = getTimeFromISO(record.date);
            
            html += `
                <div class="record">
                    <div class="record-left">
                        <div class="time">${time}</div>
                        <div class="bp-row">
                            <span>${record.systolic}/${record.diastolic}</span>
                            <span class="pulse">
                                <span class="pulse-icon">❤️</span>
                                <span>${record.pulse}</span>
                            </span>
                        </div>
                    </div>
                    <div class="status-bar ${statusClass}"></div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}

loadRecords();

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadRecords();
});
</script>

</body>
</html>
