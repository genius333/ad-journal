<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История АД</title>
    <meta name="theme-color" content="#2196f3">
    <link rel="manifest" href="manifest-journal.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding-bottom: 80px;
        }

        .header {
            background: #2196f3;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .record {
            background: white;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .bp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .pulse {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #e53935;
        }

        .pulse-icon {
            font-size: 20px;
        }

        .status-bar {
            width: 6px;
            height: 40px;
            border-radius: 3px;
            margin-left: 15px;
        }

        .status-normal { background: #8bc34a; }
        .status-elevated { background: #cddc39; }
        .status-high1 { background: #ffc107; }
        .status-high2 { background: #ff5722; }

        .date-header {
            background: #2196f3;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #f44336;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(244,67,54,0.4);
            cursor: pointer;
            text-decoration: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            color: #f44336;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 История</h1>
</div>

<div id="records-container"></div>
<a href="https://genius333.github.io/ad-calculator/" class="fab" title="Добавить запись">+</a>

<script>
let allRecords = [];

function loadRecords() {
    const data = localStorage.getItem('ad_history');
    allRecords = data ? JSON.parse(data) : [];
    renderRecords();
}

function getStatusClass(systolic, diastolic) {
    if (systolic >= 140 || diastolic >= 90) return 'status-high2';
    if (systolic >= 130 || diastolic >= 80) return 'status-high1';
    if (systolic >= 120 && diastolic < 80) return 'status-elevated';
    return 'status-normal';
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) {
        return 'Сегодня';
    } else if (date.toDateString() === yesterday.toDateString()) {
        return 'Вчера';
    } else {
        return date.toLocaleDateString('ru-RU', { 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        }) + ' г.';
    }
}

function renderRecords() {
    const container = document.getElementById('records-container');
    
    if (allRecords.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <div style="font-size: 18px; margin-bottom: 10px;">Нет записей</div>
                <div style="font-size: 14px;">Нажмите + чтобы добавить первое измерение</div>
            </div>
        `;
        return;
    }
    // Группируем по датам
    const grouped = {};
    allRecords.forEach(record => {
        const dateKey = record.date.split(',')[0];
        if (!grouped[dateKey]) {
            grouped[dateKey] = [];
        }
        grouped[dateKey].push(record);
    });

    let html = '';
    Object.keys(grouped).sort((a, b) => {
        const dateA = new Date(a);
        const dateB = new Date(b);
        return dateB - dateA;
    }).forEach(dateKey => {
        html += `<div class="date-header">${formatDate(grouped[dateKey][0].date)}</div>`;
        
        grouped[dateKey].forEach(record => {
            const statusClass = getStatusClass(record.systolic, record.diastolic);
            const time = record.date.split(',')[1]?.trim() || '';
            
            html += `
                <div class="record">
                    <div class="record-left">
                        <div class="time">${time}</div>
                        <div class="bp-row">
                            <span>${record.systolic}/${record.diastolic}</span>
                            <span class="pulse">
                                <span class="pulse-icon">❤️</span>
                                <span>${record.pulse}</span>
                            </span>
                        </div>
                    </div>
                    <div class="status-bar ${statusClass}"></div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}

// Загрузка при старте
loadRecords();

// Автообновление при возврате на вкладку
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {        loadRecords();
    }
});
</script>

</body>
  </html>
