<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Журнал АД</title>
    <meta name="theme-color" content="#28a745">
    <link rel="manifest" href="manifest.json">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#333;margin:0;padding:15px;padding-bottom:90px}
        .header{text-align:center;margin-bottom:20px}
        .header h1{color:#28a745;margin:0;font-size:22px}
        .header a{display:inline-block;margin-top:10px;color:#007bff;text-decoration:none;font-size:14px}
        .date-header{font-weight:bold;color:#28a745;margin:20px 0 10px;font-size:16px;border-bottom:2px solid #eee;padding-bottom:5px}
        .record{background:#fff;border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center}
        .record-left{display:flex;flex-direction:column;gap:2px;flex:1}
        .time{font-size:13px;color:#666}
        .bp-row{display:flex;align-items:center;gap:15px;font-size:18px;font-weight:600;color:#333}
        .pulse{display:flex;align-items:center;gap:5px;color:#e53935}
        .status-label{font-size:13px;font-weight:500;margin-top:4px}
        .status-bar{width:6px;height:40px;border-radius:3px;margin-left:10px}
        .status-normal{background:#4caf50}.status-moderate{background:#8bc34a}.status-elevated{background:#ffc107}.status-high{background:#f44336}
        .empty-state{text-align:center;padding:60px 20px;color:#999}
        .loading{text-align:center;padding:40px;color:#666}
        .fab{position:fixed;bottom:25px;right:25px;width:60px;height:60px;background:#28a745;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:300;box-shadow:0 4px 15px rgba(40,167,69,.4);text-decoration:none}
    </style>
</head>
<body>
<div class="header">
    <h1>📊 Журнал измерений</h1>
    <a href="index.html">← Калькулятор</a>
</div>
<div id="records-container"><div class="loading">⏳ Загрузка из Firebase...</div></div>
<a href="index.html" class="fab">+</a>

<script>
    // 🔥 FIREBASE CONFIG (тот же, что в калькуляторе)
    const firebaseConfig = {
      apiKey: "AIzaSyBx4YWnqSfcjFZ8gPRzUesE7omHCpSOas",
      authDomain: "healthapp-d77d4.firebaseapp.com",
      databaseURL: "https://healthapp-d77d4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "healthapp-d77d4",
      storageBucket: "healthapp-d77d4.firebasestorage.app",
      messagingSenderId: "475996337263",
      appId: "1:475996337263:web:e6f7ec8ebf529a8dbbc99a"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function getStatusInfo(s, d) {
        if (s >= 160 || d >= 100) return { class: 'status-high', text: '⚠️ Гипертензия', color: '#f44336' };
        if (s >= 140 || d >= 90) return { class: 'status-elevated', text: '📈 Повышенное', color: '#ffc107' };
        if (s >= 120 || d >= 80) return { class: 'status-moderate', text: '⚡ Умеренно повышенное', color: '#8bc34a' };
        return { class: 'status-normal', text: '✅ Норма', color: '#4caf50' };
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'Нет даты';
        const parts = dateStr.split(' ');
        const d = new Date(parts[0]);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return 'Сегодня';
        if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function loadFromFirebase() {
        const container = document.getElementById('records-container');
        
        database.ref('bp_logs').orderByChild('date').limitToLast(100).once('value')
            .then(snapshot => {
                if (!snapshot.exists()) {
                    container.innerHTML = `<div class="empty-state"><div style="font-size:60px;opacity:.3;margin-bottom:20px">📋</div><div>Нет записей</div><div style="font-size:14px">Сделай замер и нажми "Сохранить"</div></div>`;
                    return;
                }

                const records = [];
                snapshot.forEach(child => {
                    records.push(child.val());
                });
                
                // Сортировка: новые сверху
                records.sort((a, b) => {
                    const dateA = new Date(a.date);
                    const dateB = new Date(b.date);
                    return dateB - dateA;
                });

                // Группировка по датам
                const grouped = {};
                records.forEach(r => {
                    const dateKey = r.date ? r.date.split(' ')[0] : 'unknown';
                    if (!grouped[dateKey]) grouped[dateKey] = [];                    grouped[dateKey].push(r);
                });

                let html = '';
                Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(dateKey => {
                    const first = grouped[dateKey][0];
                    html += `<div class="date-header">${formatDate(first.date)}</div>`;
                    
                    grouped[dateKey].forEach(r => {
                        const s = r.systolic || r.систолическое || 0;
                        const d = r.diastolic || r.диастолическое || 0;
                        const p = r.pulse || r.пульс || 0;
                        const status = getStatusInfo(s, d);
                        const time = r.date ? r.date.split(' ')[1] : '--:--';

                        html += `
                            <div class="record">
                                <div class="record-left">
                                    <div class="time">${time}</div>
                                    <div class="bp-row"><span>${s}/${d}</span><span class="pulse">❤️ ${p}</span></div>
                                    <div class="status-label" style="color:${status.color}">${status.text}</div>
                                </div>
                                <div class="status-bar ${status.class}"></div>
                            </div>`;
                    });
                });

                container.innerHTML = html;
            })
            .catch(error => {
                console.error(error);
                container.innerHTML = `<div class="empty-state">❌ Ошибка загрузки<br><small>${error.message}</small></div>`;
            });
    }

    loadFromFirebase();
    
    // Автообновление при возврате на вкладку
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) loadFromFirebase();
    });
</script>
</body>
</html>
