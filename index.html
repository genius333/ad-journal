<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал АД</title>
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="manifest-journal.json">
    <style>
        /* Общие стили как в Калькуляторе */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9; /* Светло-серый фон */
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px; /* Место для кнопки */
        }

        /* Шапка как в калькуляторе */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #007bff; /* Синий текст */
            margin: 0;
            font-size: 22px;
        }

        /* Заголовки дат (как заголовки замеров) */
        .date-header {
            font-weight: bold;
            color: #007bff;
            margin: 20px 0 10px;
            font-size: 16px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        /* Карточка записи (как карточка замера) */
        .record {
            background: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .time {
            font-size: 13px;
            color: #666;
        }

        .bp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .pulse {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #e53935;
        }

        .pulse-icon {
            font-size: 20px;
        }

        /* Полоска статуса */
        .status-bar {
            width: 6px;
            height: 40px;
            border-radius: 3px;
            margin-left: 10px;
        }

        .status-normal { background: #4caf50; } /* Зеленый */
        .status-elevated { background: #ffc107; } /* Желтый */
        .status-high1 { background: #ff9800; } /* Оранжевый */
        .status-high2 { background: #f44336; } /* Красный */

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;        }

        /* Синяя кнопка */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: #007bff; /* СИНЯЯ КНОПКА */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 300;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Шапка в стиле калькулятора -->
<div class="header">
    <h1>📊 Журнал измерений</h1>
</div>

<div id="records-container"></div>

<!-- Синяя кнопка ведет в Калькулятор -->
<a href="https://genius333.github.io/ad-calculator/" class="fab">+</a>

<script>
let allRecords = [];

function loadRecords() {
    const data = localStorage.getItem('ad_history');
    allRecords = data ? JSON.parse(data) : [];
    renderRecords();
}

function getStatusClass(systolic, diastolic) {
    if (systolic >= 140 || diastolic >= 90) return 'status-high2';
    if (systolic >= 130 || diastolic >= 80) return 'status-high1';
    if (systolic >= 120 && diastolic < 80) return 'status-elevated';
    return 'status-normal';
}
function formatDate(dateStr) {
    const date = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) {
        return 'Сегодня';
    } else if (date.toDateString() === yesterday.toDateString()) {
        return 'Вчера';
    } else {
        return date.toLocaleDateString('ru-RU', { 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        }) + ' г.';
    }
}

function renderRecords() {
    const container = document.getElementById('records-container');
    
    if (allRecords.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;">📋</div>
                <div style="font-size: 18px; margin-bottom: 10px;">Нет записей</div>
                <div style="font-size: 14px;">Нажмите + чтобы добавить измерение</div>
            </div>
        `;
        return;
    }

    const grouped = {};
    allRecords.forEach(record => {
        const dateKey = record.date.split(',')[0];
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push(record);
    });

    let html = '';
    Object.keys(grouped).sort((a, b) => {
        const dateA = new Date(a);
        const dateB = new Date(b);
        return dateB - dateA;
    }).forEach(dateKey => {
        html += `<div class="date-header">${formatDate(grouped[dateKey][0].date)}</div>`;
        
        grouped[dateKey].forEach(record => {
            const statusClass = getStatusClass(record.systolic, record.diastolic);            const time = record.date.split(',')[1]?.trim() || '';
            
            html += `
                <div class="record">
                    <div class="record-left">
                        <div class="time">${time}</div>
                        <div class="bp-row">
                            <span>${record.systolic}/${record.diastolic}</span>
                            <span class="pulse">
                                <span class="pulse-icon">❤️</span>
                                <span>${record.pulse}</span>
                            </span>
                        </div>
                    </div>
                    <div class="status-bar ${statusClass}"></div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}

loadRecords();

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadRecords();
});
</script>

</body>
</html>
